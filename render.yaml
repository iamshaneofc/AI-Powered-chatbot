services:
  - type: web
    name: ai-qa-backend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: openrouter
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-qa-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false

  - type: redis
    name: ai-qa-redis
    region: ohio
    plan: free
    ipAllowList: []
