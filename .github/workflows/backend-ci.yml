name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-backend:
    name: Test and Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 httpx pytest pytest-asyncio pytest-cov

    - name: Run linting (flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run pytest with coverage
      env:
        OPENAI_API_KEY: "dummy-key-for-testing"
      run: |
        pytest -v --cov=app --cov-report=xml --cov-report=term

    - name: Validate FastAPI Startup
      env:
        OPENAI_API_KEY: "dummy-key-for-testing"
      run: |
        # Start the server in the background
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 5
        
        # Hit the health endpoint to verify it's running
        curl -f http://localhost:8000/api/v1/health || (kill $SERVER_PID && exit 1)
        
        # Clean up
        kill $SERVER_PID
